{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Todo List</title>
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
</head>
<body>
    
    <h1>Todo List</h1>
    <form action="{% url 'add_task' %}" method="post">
        {% csrf_token %}
        <input type="text" name="task">
        <button type="submit">Add Task</button>
    </form>
    <table class="task-table">
        <thead>
            <tr>
                <th>Sr.No</th>
                <th>Task</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks %}
            <tr id="task-{{ task.id }}">
                <td>{{ forloop.counter }}</td>
                <td>{{ task.task }}</td>
                <td>{% if task.completion_status %}Completed{% else %}Pending{% endif %}</td>
                <td>
                    <form action="{% url 'delete_task' task.id %}" method="post">
                        {% csrf_token %}
                        <button type="submit">Delete</button>
                    </form>
                    <form action="{% url 'mark_as_completed' task.id %}" method="post">
                        {% csrf_token %}
                        <button type="submit">Complete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    
</body>
</html>
